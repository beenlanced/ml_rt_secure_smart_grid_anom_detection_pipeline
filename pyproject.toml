[project]
name = "iiot-project"
version = "0.1.0"
description = "A Real-Time, Secure Smart Grid Anomaly Detection Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka[zstd]>=0.14.0",
    "apache-flink>=2.1.0",
    "confluent-kafka>=2.15.0",
    "cramjam>=2.12.1",
    "numpy>=1.26.0,<2.2.0",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.4",
    "scapy>=2.7.0",
]

[tool.uv]
build-constraint-dependencies = ["setuptools<82"]
